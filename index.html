<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ريدان | كشف توصيل الطلبات</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="hero">
  <div class="brand">🍽️ مطعم ريدان للمندي</div>
  <div class="title">كشف توصيل الطلبات الخارجية</div>
  <div class="sub" id="dateTime"></div>
</header>

<main>
<section class="stats">
  <div><b id="availableCount">0</b><span>متاح</span></div>
  <div><b id="outCount">0</b><span>خارج للتوصيل</span></div>
  <div><b id="ordersCount">0</b><span>طلبات نشطة</span></div>
</section>

<section class="panel">
  <h2>🥇 دور الدلفري</h2>
  <div id="priority" class="priority"></div>
</section>

<section>
  <h2>الدلفري</h2>
  <div id="drivers" class="drivers"></div>
</section>

<section class="panel">
  <h2>🔴 جاري التوصيل</h2>
  <div id="activeOrders" class="active"></div>
</section>

<div class="actions">
  <button class="gold" onclick="endShift()">🔒 إنهاء الدوام وإنشاء الكشف</button>
  <a href="admin.html" class="btn">لوحة التحكم</a>
</div>
</main>

<script src="app.js"></script>
</body>
</html>
